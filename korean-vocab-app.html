<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="단어장">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1612">
<title>단어장</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;700&family=DM+Mono:ital,wght@0,300;0,400;1,300&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --ink: #1a1612;
  --paper: #f4ede0;
  --cream: #ede3cf;
  --aged: #c8b89a;
  --faded: #a89880;
  --rust: #b8472a;
  --gold: #c08c20;
  --sage: #4a7055;
  --highlight: #f0d060;
  --card-bg: #faf6ee;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

html, body {
  height: 100%;
  overflow: hidden;
  background: var(--ink);
}

body {
  font-family: 'DM Mono', monospace;
  color: var(--ink);
  display: flex;
  flex-direction: column;
  background: var(--paper);
  background-image:
    radial-gradient(ellipse at 20% 0%, rgba(192,140,32,0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 100%, rgba(184,71,42,0.05) 0%, transparent 50%);
}

/* ── STATUS BAR SPACER ── */
.status-spacer {
  height: var(--safe-top);
  background: var(--ink);
  flex-shrink: 0;
}

/* ── HEADER ── */
.header {
  background: var(--ink);
  color: var(--paper);
  padding: 14px 24px 12px;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-shrink: 0;
}

.header-title {
  font-family: 'Noto Serif KR', serif;
  font-size: 19px;
  font-weight: 400;
  letter-spacing: 0.5px;
}

.header-dot { color: var(--rust); margin: 0 2px; }

.header-stats {
  margin-left: auto;
  display: flex;
  gap: 18px;
}

.hstat { text-align: center; }
.hstat-n {
  font-family: 'Cormorant Garamond', serif;
  font-size: 20px;
  font-weight: 600;
  color: var(--highlight);
  line-height: 1;
}
.hstat-l {
  font-size: 8px;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--faded);
  margin-top: 2px;
}

/* ── NAV TABS ── */
.nav {
  background: var(--ink);
  display: flex;
  border-top: 1px solid rgba(255,255,255,0.08);
  flex-shrink: 0;
}

.nav-btn {
  flex: 1;
  padding: 10px 8px;
  font-size: 9px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--faded);
  background: none;
  border: none;
  cursor: pointer;
  font-family: 'DM Mono', monospace;
  transition: color 0.2s;
  border-bottom: 2px solid transparent;
}

.nav-btn.active { color: var(--paper); border-bottom-color: var(--rust); }

/* ── MAIN AREA ── */
.main {
  flex: 1;
  overflow: hidden;
  position: relative;
  display: flex;
  flex-direction: column;
}

/* ── SCREEN ── */
.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
}

.screen.active {
  opacity: 1;
  pointer-events: all;
}

/* ══════════════════════════════
   FLASHCARD SCREEN
══════════════════════════════ */
#screen-flash {
  background: var(--paper);
}

.filter-scroll {
  display: flex;
  gap: 8px;
  padding: 14px 20px;
  overflow-x: auto;
  flex-shrink: 0;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.filter-scroll::-webkit-scrollbar { display: none; }

.chip {
  flex-shrink: 0;
  padding: 7px 16px;
  border-radius: 20px;
  border: 1.5px solid var(--aged);
  font-size: 10px;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color: var(--faded);
  background: transparent;
  font-family: 'DM Mono', monospace;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.chip.active { background: var(--rust); border-color: var(--rust); color: white; }

/* Progress */
.prog-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 20px 10px;
  flex-shrink: 0;
}

.prog-track {
  flex: 1;
  height: 2px;
  background: var(--cream);
  border-radius: 2px;
  overflow: hidden;
}

.prog-fill {
  height: 100%;
  background: var(--rust);
  transition: width 0.4s ease;
  border-radius: 2px;
}

.prog-text {
  font-size: 10px;
  color: var(--faded);
  letter-spacing: 0.5px;
  white-space: nowrap;
}

/* Mode toggle */
.mode-row {
  display: flex;
  gap: 8px;
  padding: 0 20px 14px;
  flex-shrink: 0;
  justify-content: flex-end;
  align-items: center;
}

.mode-label {
  font-size: 9px;
  color: var(--faded);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-right: 4px;
}

.mode-pill {
  display: flex;
  border: 1.5px solid var(--aged);
  border-radius: 20px;
  overflow: hidden;
}

.mode-opt {
  padding: 5px 14px;
  font-size: 9px;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color: var(--faded);
  background: transparent;
  border: none;
  cursor: pointer;
  font-family: 'DM Mono', monospace;
  transition: all 0.15s;
}
.mode-opt.active { background: var(--ink); color: var(--paper); }

/* ── CARD CONTAINER ── */
.card-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 24px;
  position: relative;
  overflow: hidden;
  cursor: pointer;
  touch-action: pan-y;
}

.card {
  width: 100%;
  max-width: 640px;
  min-height: 300px;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.5s cubic-bezier(0.4,0,0.2,1);
  will-change: transform;
}

.card.flipped { transform: rotateY(180deg); }

.card-face {
  position: absolute;
  inset: 0;
  min-height: 300px;
  background: var(--card-bg);
  border-radius: 12px;
  border: 1px solid var(--aged);
  box-shadow:
    0 2px 0 var(--aged),
    0 4px 0 rgba(180,155,115,0.4),
    0 8px 32px rgba(26,22,18,0.12);
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 32px 32px;
  gap: 14px;
}

.card-back { transform: rotateY(180deg); }

.card-meta {
  position: absolute;
  top: 16px;
  left: 0;
  right: 0;
  padding: 0 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.card-source {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 9px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--faded);
}

.src-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
}

.dot-살구   { background: var(--rust); }
.dot-작사가 { background: var(--sage); }
.dot-기문법 { background: var(--gold); }

.card-badge {
  font-size: 8px;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 3px 9px;
  border-radius: 10px;
}
.badge-vocab   { background: rgba(192,140,32,0.12); color: var(--gold); }
.badge-grammar { background: rgba(74,112,85,0.12);  color: var(--sage); }
.badge-phrase  { background: rgba(184,71,42,0.12);  color: var(--rust); }

.card-kr {
  font-family: 'Noto Serif KR', serif;
  font-size: clamp(30px, 6vw, 48px);
  font-weight: 300;
  text-align: center;
  line-height: 1.3;
  color: var(--ink);
}

.card-hint {
  font-size: 11px;
  color: var(--aged);
  font-style: italic;
  text-align: center;
}

.card-en {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(22px, 4.5vw, 34px);
  font-style: italic;
  text-align: center;
  color: var(--ink);
  line-height: 1.35;
}

.card-notes {
  font-size: 11px;
  color: var(--faded);
  text-align: center;
  max-width: 340px;
  line-height: 1.7;
}

.tap-hint {
  position: absolute;
  bottom: 14px;
  right: 16px;
  font-size: 9px;
  color: var(--aged);
  letter-spacing: 0.8px;
}

/* Swipe hint arrows */
.swipe-hint {
  position: absolute;
  bottom: 10px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: center;
  gap: 40px;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.3s;
}
.swipe-hint.visible { opacity: 1; }

.sh-item {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 9px;
  letter-spacing: 0.8px;
  text-transform: uppercase;
}
.sh-hard { color: var(--rust); }
.sh-ok   { color: var(--gold); }
.sh-easy { color: var(--sage); }

/* ── RATING BUTTONS ── */
.rating-row {
  display: flex;
  gap: 10px;
  padding: 14px 24px;
  flex-shrink: 0;
  padding-bottom: calc(14px + var(--safe-bottom));
}

.r-btn {
  flex: 1;
  padding: 16px 8px;
  border-radius: 10px;
  border: 1.5px solid var(--aged);
  font-size: 10px;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  cursor: pointer;
  font-family: 'DM Mono', monospace;
  background: white;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  transition: all 0.15s;
  -webkit-user-select: none;
}

.r-btn:active { transform: scale(0.96); }
.r-emoji { font-size: 20px; }

.r-hard { color: var(--rust); border-color: rgba(184,71,42,0.3); }
.r-hard:active { background: var(--rust); color: white; }
.r-ok   { color: var(--gold); border-color: rgba(192,140,32,0.3); }
.r-ok:active   { background: var(--gold); color: white; }
.r-easy { color: var(--sage); border-color: rgba(74,112,85,0.3); }
.r-easy:active { background: var(--sage); color: white; }

/* ── DONE SCREEN ── */
.done-overlay {
  position: absolute;
  inset: 0;
  background: var(--paper);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 40px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
  z-index: 10;
}
.done-overlay.show { opacity: 1; pointer-events: all; }

.done-ko {
  font-family: 'Noto Serif KR', serif;
  font-size: 56px;
  font-weight: 300;
  color: var(--rust);
}
.done-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 28px;
  font-style: italic;
  color: var(--ink);
}
.done-stats {
  font-size: 11px;
  color: var(--faded);
  letter-spacing: 0.5px;
  text-align: center;
  line-height: 2;
}
.done-scores {
  display: flex;
  gap: 24px;
  margin: 8px 0;
}
.ds-item { text-align: center; }
.ds-n { font-family: 'Cormorant Garamond', serif; font-size: 32px; font-weight: 600; line-height: 1; }
.ds-l { font-size: 9px; letter-spacing: 1px; text-transform: uppercase; color: var(--faded); margin-top: 4px; }
.ds-hard .ds-n { color: var(--rust); }
.ds-ok   .ds-n { color: var(--gold); }
.ds-easy .ds-n { color: var(--sage); }

.restart-btn {
  margin-top: 8px;
  padding: 14px 40px;
  border: 2px solid var(--ink);
  border-radius: 8px;
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
  cursor: pointer;
  background: var(--ink);
  color: var(--paper);
  font-family: 'DM Mono', monospace;
  -webkit-user-select: none;
}

/* ══════════════════════════════
   BROWSE SCREEN
══════════════════════════════ */
#screen-browse {
  background: var(--paper);
}

.search-wrap {
  padding: 14px 20px 10px;
  flex-shrink: 0;
}

.search-box {
  width: 100%;
  padding: 12px 18px;
  border: 1.5px solid var(--aged);
  border-radius: 10px;
  font-family: 'Noto Serif KR', serif;
  font-size: 16px;
  background: var(--card-bg);
  color: var(--ink);
  outline: none;
}
.search-box:focus { border-color: var(--rust); }

.browse-scroll {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 0 20px;
  padding-bottom: var(--safe-bottom);
}

.b-section-head {
  font-size: 9px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--faded);
  padding: 18px 0 8px;
  display: flex;
  align-items: center;
  gap: 8px;
  position: sticky;
  top: 0;
  background: var(--paper);
  z-index: 1;
}
.b-count {
  font-size: 9px;
  background: var(--cream);
  color: var(--faded);
  padding: 2px 7px;
  border-radius: 8px;
}

.b-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 4px;
  border-bottom: 1px solid rgba(200,184,154,0.25);
}

.b-kr {
  font-family: 'Noto Serif KR', serif;
  font-size: 19px;
  font-weight: 400;
  min-width: 120px;
  flex-shrink: 0;
}

.b-right { flex: 1; min-width: 0; }

.b-en {
  font-family: 'Cormorant Garamond', serif;
  font-size: 15px;
  font-style: italic;
  color: var(--ink);
  line-height: 1.3;
}

.b-note {
  font-size: 10px;
  color: var(--faded);
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.b-pill {
  font-size: 8px;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  padding: 3px 8px;
  border-radius: 8px;
  flex-shrink: 0;
}

/* ══════════════════════════════
   INSTALL BANNER
══════════════════════════════ */
.install-banner {
  background: var(--ink);
  color: var(--paper);
  padding: 12px 20px;
  font-size: 11px;
  letter-spacing: 0.3px;
  line-height: 1.6;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}
.install-banner.hidden { display: none; }
.install-icon { font-size: 20px; flex-shrink: 0; }
.install-text { flex: 1; }
.install-text strong { color: var(--highlight); }
.install-close {
  background: none;
  border: none;
  color: var(--faded);
  font-size: 18px;
  cursor: pointer;
  padding: 4px;
  flex-shrink: 0;
}

/* Swipe animation */
@keyframes swipeLeft {
  0%   { transform: translateX(0) rotate(0deg); opacity: 1; }
  100% { transform: translateX(-120%) rotate(-8deg); opacity: 0; }
}
@keyframes swipeRight {
  0%   { transform: translateX(0) rotate(0deg); opacity: 1; }
  100% { transform: translateX(120%) rotate(8deg); opacity: 0; }
}
@keyframes slideIn {
  0%   { transform: translateX(60px); opacity: 0; }
  100% { transform: translateX(0); opacity: 1; }
}

.card-wrap.swipe-left  .card { animation: swipeLeft  0.3s ease forwards; }
.card-wrap.swipe-right .card { animation: swipeRight 0.3s ease forwards; }
.card-wrap.slide-in    .card { animation: slideIn    0.3s ease forwards; }

</style>
</head>
<body>

<div class="status-spacer"></div>

<!-- INSTALL BANNER -->
<div class="install-banner" id="install-banner">
  <span class="install-icon">📎</span>
  <div class="install-text">
    <strong>Add to Home Screen</strong> — tap <strong>Share ↑</strong> then <strong>"Add to Home Screen"</strong> for fullscreen app
  </div>
  <button class="install-close" onclick="dismissBanner()">×</button>
</div>

<!-- HEADER -->
<div class="header">
  <div class="header-title">단어장<span class="header-dot">·</span>Vocab</div>
  <div class="header-stats">
    <div class="hstat"><div class="hstat-n" id="s-total">0</div><div class="hstat-l">Total</div></div>
    <div class="hstat"><div class="hstat-n" id="s-known">0</div><div class="hstat-l">Known</div></div>
    <div class="hstat"><div class="hstat-n" id="s-due">0</div><div class="hstat-l">Due</div></div>
  </div>
</div>

<!-- NAV -->
<div class="nav">
  <button class="nav-btn active" id="nav-flash"  onclick="goTab('flash')">Flashcards</button>
  <button class="nav-btn"        id="nav-browse" onclick="goTab('browse')">Browse All</button>
</div>

<!-- MAIN -->
<div class="main">

  <!-- ── FLASHCARD SCREEN ── -->
  <div class="screen active" id="screen-flash">

    <!-- Filters -->
    <div class="filter-scroll" id="filter-scroll">
      <button class="chip active" data-f="all"     onclick="setFilter(this)">All</button>
      <button class="chip"        data-f="살구"    onclick="setFilter(this)">살구 싫나</button>
      <button class="chip"        data-f="작사가"  onclick="setFilter(this)">한로로</button>
      <button class="chip"        data-f="vocab"   onclick="setFilter(this)">Vocab</button>
      <button class="chip"        data-f="grammar" onclick="setFilter(this)">Grammar</button>
      <button class="chip"        data-f="phrase"  onclick="setFilter(this)">Phrases</button>
      <button class="chip"        data-f="due"     onclick="setFilter(this)">Due Today</button>
    </div>

    <!-- Progress -->
    <div class="prog-row">
      <div class="prog-track"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
      <div class="prog-text" id="prog-text">— / —</div>
    </div>

    <!-- Mode -->
    <div class="mode-row">
      <span class="mode-label">Direction</span>
      <div class="mode-pill">
        <button class="mode-opt active" id="mode-kr" onclick="setMode('kr-en',this)">KR→EN</button>
        <button class="mode-opt"        id="mode-en" onclick="setMode('en-kr',this)">EN→KR</button>
      </div>
    </div>

    <!-- Card -->
    <div class="card-wrap" id="card-wrap" onclick="handleCardTap(event)">
      <div class="card" id="card">
        <!-- Front -->
        <div class="card-face card-front">
          <div class="card-meta">
            <div class="card-source">
              <span class="src-dot" id="f-dot"></span>
              <span id="f-src"></span>
            </div>
            <span class="card-badge" id="f-badge"></span>
          </div>
          <div class="card-kr" id="f-main"></div>
          <div class="card-hint" id="f-hint"></div>
          <div class="tap-hint">tap to reveal</div>
        </div>
        <!-- Back -->
        <div class="card-face card-back">
          <div class="card-meta">
            <div class="card-source">
              <span class="src-dot" id="b-dot"></span>
              <span id="b-src"></span>
            </div>
            <span class="card-badge" id="b-badge"></span>
          </div>
          <div class="card-en" id="b-main"></div>
          <div class="card-notes" id="b-notes"></div>
          <div class="tap-hint">swipe or tap buttons</div>
        </div>
      </div>

      <!-- Swipe hints -->
      <div class="swipe-hint" id="swipe-hint">
        <span class="sh-item sh-hard">← Hard</span>
        <span class="sh-item sh-easy">Easy →</span>
      </div>

      <!-- Done overlay -->
      <div class="done-overlay" id="done-overlay">
        <div class="done-ko">완료!</div>
        <div class="done-title">Session Complete</div>
        <div class="done-scores">
          <div class="ds-item ds-hard"><div class="ds-n" id="d-hard">0</div><div class="ds-l">Hard</div></div>
          <div class="ds-item ds-ok">  <div class="ds-n" id="d-ok">0</div>  <div class="ds-l">OK</div></div>
          <div class="ds-item ds-easy"><div class="ds-n" id="d-easy">0</div><div class="ds-l">Easy</div></div>
        </div>
        <div class="done-stats" id="done-stats"></div>
        <button class="restart-btn" onclick="restartDeck()">Study Again →</button>
      </div>
    </div>

    <!-- Rating Buttons -->
    <div class="rating-row" id="rating-row" style="visibility:hidden">
      <button class="r-btn r-hard" ontouchstart="" onclick="rateCard(1)"><span class="r-emoji">😓</span>Hard</button>
      <button class="r-btn r-ok"   ontouchstart="" onclick="rateCard(2)"><span class="r-emoji">🤔</span>OK</button>
      <button class="r-btn r-easy" ontouchstart="" onclick="rateCard(3)"><span class="r-emoji">✓</span>Easy</button>
    </div>
  </div>

  <!-- ── BROWSE SCREEN ── -->
  <div class="screen" id="screen-browse">
    <div class="search-wrap">
      <input class="search-box" type="search" placeholder="한국어 또는 English…" id="search-box" oninput="renderBrowse()">
    </div>
    <div class="browse-scroll" id="browse-list"></div>
  </div>

  const s = getSRS()[id];
  if (!s || s.reps===0) return 'new';
  if (s.interval < 2)   return 'learning';
  return 'known';
}
function isDue(id) {
  const s = getSRS()[id];
  return !s || (s.nextDue||0) <= Date.now();
}

// ── DECK BUILD ──
function buildDeck() {
  let pool = CARDS.filter(c => {
    if (filter==='all')    return true;
    if (filter==='살구')   return c.src==='살구';
    if (filter==='작사가') return c.src==='작사가'||c.src==='기문법';
    if (filter==='vocab')  return c.type==='vocab';
    if (filter==='grammar')return c.type==='grammar';
    if (filter==='phrase') return c.type==='phrase';
    if (filter==='due')    return isDue(c.id);
    return true;
  });
  // Shuffle (Fisher-Yates)
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  return pool;
}

// ── RENDER CARD ──
function renderCard() {
  if (idx >= deck.length) { showDone(); return; }
  const c = deck[idx];
  flipped = false;
  document.getElementById('card').classList.remove('flipped');
  document.getElementById('rating-row').style.visibility = 'hidden';
  document.getElementById('swipe-hint').classList.remove('visible');

  const frontTxt = mode==='kr-en' ? c.kr : c.en;
  const backTxt  = mode==='kr-en' ? c.en : c.kr;

  // Front
  document.getElementById('f-main').textContent  = frontTxt;
  document.getElementById('f-hint').textContent  = mode==='kr-en' ? c.type : c.src+' · '+c.page;
  document.getElementById('f-src').textContent   = c.src+' · '+c.page;
  document.getElementById('f-dot').className     = 'src-dot dot-'+c.src;
  document.getElementById('f-badge').textContent = c.type;
  document.getElementById('f-badge').className   = 'card-badge badge-'+c.type;

  // Back
  const bm = document.getElementById('b-main');
  if (mode==='kr-en') {
    bm.style.fontFamily = "'Cormorant Garamond', serif";
    bm.style.fontStyle  = 'italic';
    bm.style.fontSize   = 'clamp(22px,4.5vw,34px)';
  } else {
    bm.style.fontFamily = "'Noto Serif KR', serif";
    bm.style.fontStyle  = 'normal';
    bm.style.fontSize   = 'clamp(28px,5vw,44px)';
  }
  bm.textContent = backTxt;
  document.getElementById('b-notes').textContent = c.note;
  document.getElementById('b-src').textContent   = c.src+' · '+c.page;
  document.getElementById('b-dot').className     = 'src-dot dot-'+c.src;
  document.getElementById('b-badge').textContent = c.type;
  document.getElementById('b-badge').className   = 'card-badge badge-'+c.type;

  // Progress
  const pct = Math.round((idx/deck.length)*100);
  document.getElementById('prog-fill').style.width = pct+'%';
  document.getElementById('prog-text').textContent  = (idx+1)+' / '+deck.length;

  updateStats();
}

// ── FLIP ──
function flipCard() {
  if (idx >= deck.length) return;
  flipped = !flipped;
  document.getElementById('card').classList.toggle('flipped', flipped);
  document.getElementById('rating-row').style.visibility = flipped ? 'visible' : 'hidden';
  document.getElementById('swipe-hint').classList.toggle('visible', flipped);
}

// ── HANDLE TAP (not on rating buttons) ──
function handleCardTap(e) {
  if (e.target.closest('.r-btn') || e.target.closest('.done-overlay')) return;
  flipCard();
}

// ── TOUCH SWIPE ──
document.getElementById('card-wrap').addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });

document.getElementById('card-wrap').addEventListener('touchend', e => {
  if (!flipped) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) < 60 || Math.abs(dy) > Math.abs(dx)*0.8) return;
  if (dx < 0) swipeRate(1);  // left = hard
  else         swipeRate(3);  // right = easy
}, { passive: true });

function swipeRate(rating) {
  const wrap = document.getElementById('card-wrap');
  wrap.classList.add(rating===1 ? 'swipe-left' : 'swipe-right');
  setTimeout(() => {
    wrap.classList.remove('swipe-left','swipe-right');
    wrap.classList.add('slide-in');
    rateCard(rating);
    setTimeout(() => wrap.classList.remove('slide-in'), 350);
  }, 280);
}

// ── RATE ──
function rateCard(rating) {
  const c = deck[idx];
  const srs = getSRS();
  const s = srs[c.id] || { reps:0, interval:1, ef:2.5, nextDue:0 };

  if (rating===1)      { s.interval=1; stats.hard++; }
  else if (rating===2) { s.interval=Math.max(1,Math.floor(s.interval*1.2)); s.ef=Math.max(1.3,s.ef-0.15); stats.ok++; }
  else                 {
    if (s.reps===0)      s.interval=1;
    else if (s.reps===1) s.interval=3;
    else                 s.interval=Math.round(s.interval*s.ef);
    s.ef=Math.min(3.0,s.ef+0.1); stats.easy++;
  }
  s.reps++;
  s.nextDue = Date.now() + s.interval*86400000;
  srs[c.id] = s;
  saveSRS(srs);

  idx++;
  flipped = false;
  document.getElementById('card').classList.remove('flipped');
  document.getElementById('rating-row').style.visibility='hidden';
  document.getElementById('swipe-hint').classList.remove('visible');
  renderCard();
}

// ── DONE ──
function showDone() {
  document.getElementById('prog-fill').style.width='100%';
  document.getElementById('prog-text').textContent = deck.length+' / '+deck.length;
  document.getElementById('d-hard').textContent = stats.hard;
  document.getElementById('d-ok').textContent   = stats.ok;
  document.getElementById('d-easy').textContent = stats.easy;

  const srs = getSRS();
  let known=0;
  CARDS.forEach(c=>{ const s=srs[c.id]; if(s&&s.interval>=2) known++; });
  document.getElementById('done-stats').textContent =
    deck.length+' cards reviewed\n'+known+' total words known';

  document.getElementById('done-overlay').classList.add('show');
  document.getElementById('rating-row').style.visibility='hidden';
  updateStats();
}

function restartDeck() {
  document.getElementById('done-overlay').classList.remove('show');
  deck = buildDeck();
  idx = 0;
  stats = { hard:0, ok:0, easy:0 };
  renderCard();
}

// ── FILTER / MODE ──
function setFilter(btn) {
  filter = btn.dataset.f;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('done-overlay').classList.remove('show');
  deck = buildDeck();
  idx = 0;
  stats = { hard:0, ok:0, easy:0 };
  renderCard();
}

function setMode(m) {
  mode = m;
  document.querySelectorAll('.mode-opt').forEach(b=>b.classList.remove('active'));
  document.getElementById(m==='kr-en'?'mode-kr':'mode-en').classList.add('active');
  renderCard();
}

// ── STATS ──
function updateStats() {
  const srs = getSRS();
  let known=0, due=0;
  CARDS.forEach(c=>{
    const s=srs[c.id];
    if(s&&s.interval>=2) known++;
    if(!s||(s.nextDue||0)<=Date.now()) due++;
  });
  document.getElementById('s-total').textContent = CARDS.length;
  document.getElementById('s-known').textContent = known;
  document.getElementById('s-due').textContent   = due;
}

// ── TABS ──
function goTab(name) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  document.getElementById('nav-'+name).classList.add('active');
  if (name==='browse') renderBrowse();
}

// ── BROWSE ──
function renderBrowse() {
  const q = document.getElementById('search-box').value.toLowerCase();
  const sections = [
    { label:'살구 싫나 · Vocabulary', src:'살구',    type:'vocab' },
    { label:'살구 싫나 · Grammar',    src:'살구',    type:'grammar' },
    { label:'살구 싫나 · Phrases',    src:'살구',    type:'phrase' },
    { label:'한로로 · 작사가 Vocab',  src:'작사가',  type:null },
    { label:'한로로 · 기본 문법',     src:'기문법',  type:null },
  ];

  let html = '';
  sections.forEach(sec => {
    const items = CARDS.filter(c => {
      const match = c.src===sec.src && (sec.type===null||c.type===sec.type);
      if (!match) return false;
      if (!q) return true;
      return c.kr.includes(q)||c.en.toLowerCase().includes(q)||(c.note&&c.note.toLowerCase().includes(q));
    });
    if (!items.length) return;
    html += `<div class="b-section-head">
      <span class="src-dot dot-${items[0].src}" style="width:7px;height:7px;border-radius:50%;flex-shrink:0"></span>
      ${sec.label}<span class="b-count">${items.length}</span>
    </div>`;
    items.forEach(c => {
      html += `<div class="b-item">
        <div class="b-kr">${c.kr}</div>
        <div class="b-right">
          <div class="b-en">${c.en}</div>
          ${c.note ? `<div class="b-note">${c.note}</div>` : ''}
        </div>
        <span class="b-pill badge-${c.type}">${c.type}</span>
      </div>`;
    });
  });

  document.getElementById('browse-list').innerHTML = html || '<div style="padding:24px;color:var(--faded);font-size:12px">No results.</div>';
}

// ── INSTALL BANNER ──
function dismissBanner() {
  document.getElementById('install-banner').classList.add('hidden');
  try { localStorage.setItem('banner_dismissed','1'); } catch {}
}
// Hide if already dismissed or already installed
try {
  if (localStorage.getItem('banner_dismissed') || window.navigator.standalone) {
    document.getElementById('install-banner').classList.add('hidden');
  }
} catch {}

// ── INIT ──
deck = buildDeck();
renderCard();
</script>
